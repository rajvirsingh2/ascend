# ─────────────────────────────────────────────────────────
# Ascend — Nginx Reverse Proxy
# ─────────────────────────────────────────────────────────

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

upstream ascend_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# ── HTTP server (redirect to HTTPS when SSL is set up) ───
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Uncomment the next 2 lines once Certbot is set up:
    # return 301 https://$host$request_uri;

    # Remove everything below this line once SSL is active
    include /etc/nginx/conf.d/ascend-proxy.inc;
}

